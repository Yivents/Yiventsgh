<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event — Yivents</title>
  <link rel="stylesheet" href="assets/site.css">
</head>
<body data-page="event">
  <div class="banner"><div class="container">Register as a guest — no password needed.</div></div>
  <header class="site">
    <div class="container">
      <a class="brand" href="index.html"><img src="apps/web/public/brand/logo.png" alt=""><span>Yivents</span></a>
      <nav><ul><li><a href="index.html">← Events</a></li><li><a id="auth-link" href="login.html">Sign in</a></li></ul></nav>
    </div>
  </header>
  <main class="container block">
    <div id="page-message"></div>
    <div id="event-detail">
      <h1 id="event-title">Event</h1>
      <p id="event-summary" class="muted"></p>
      <p class="row"><span id="event-date" class="pill"></span><span id="event-venue" class="pill price"></span></p>

      <div class="grid grid-2" style="margin-top:1.5rem">
        <section class="panel">
          <h2>Register</h2>
          <form id="registration-form">
            <div class="field"><label for="fullName">Full name</label><input id="fullName" name="fullName" required maxlength="120"></div>
            <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required maxlength="160"></div>
            <div class="field"><label for="phone">Ghana phone (optional)</label><input id="phone" name="phone" type="tel" placeholder="0XXXXXXXXX" maxlength="40"></div>
            <h3>Questions</h3>
            <div id="form-fields"></div>
            <div class="field"><label for="screenshot">Payment screenshot (optional, max 2 MB)</label><input id="screenshot" name="screenshot" type="file" accept="image/*"></div>
            <button id="register-button" class="primary" type="submit">Submit registration</button>
          </form>
          <div id="registration-message"></div>
        </section>

        <section>
          <h2>Payment details</h2>
          <p class="muted">Pay the organizer directly. Do not send money to Yivents.</p>
          <div id="payment-methods" class="stack"></div>
        </section>
      </div>
    </div>
  </main>
  <footer class="site"><div class="container"><p class="tiny">[LEGAL REVIEW NEEDED] · [YOUR NAME] · [SUPPORT EMAIL] · [DOMAIN]</p></div></footer>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
